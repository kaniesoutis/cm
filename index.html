<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>ChotoMoto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:'Fredoka',sans-serif;
  background:#050a04;
  min-height:100svh;
  touch-action:manipulation;
}
body::before{
  content:"";position:fixed;inset:0;
  background:
    radial-gradient(ellipse 55% 45% at 50% 50%,rgba(0,80,0,.55) 0%,transparent 65%),
    radial-gradient(circle at 15% 20%,rgba(80,200,0,.18) 0%,transparent 30%),
    radial-gradient(circle at 85% 15%,rgba(180,0,200,.14) 0%,transparent 28%),
    radial-gradient(circle at 80% 85%,rgba(0,180,60,.16) 0%,transparent 30%),
    radial-gradient(circle at 10% 80%,rgba(100,0,180,.12) 0%,transparent 26%),
    linear-gradient(180deg,#020703 0%,#04100a 50%,#020703 100%);
  pointer-events:none;z-index:0;
}

/* ── SCREENS ── */
.screen{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:5;
  transition:opacity .4s ease,transform .4s cubic-bezier(.34,1.4,.64,1);
}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(.94)}
.screen.out{opacity:0;pointer-events:none;transform:scale(1.06)}

/* ── SETUP ── */
.setup-card{
  background:#0d1a0b;border-radius:24px;
  padding:28px 22px;width:min(440px,100%);
  box-shadow:0 20px 60px rgba(0,0,0,.7),0 4px 0 #1a4a10,0 0 80px rgba(0,200,60,.08);
  border:2px solid #1e3a18;position:relative;z-index:1;
}
.setup-title{
  font-size:clamp(32px,8vw,46px);font-weight:700;color:#7dff6b;
  text-align:center;margin-bottom:4px;line-height:1.1;
  text-shadow:0 0 30px rgba(100,255,80,.4);
}
.setup-sub{font-family:'Nunito',sans-serif;font-size:13px;color:#4a7a44;text-align:center;margin-bottom:20px}
.name-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.name-field{display:flex;flex-direction:column;gap:5px}
.name-field label{font-size:11px;font-weight:600;letter-spacing:.06em;color:#4a7a44;text-transform:uppercase}
.name-input{
  border:2px solid #1e3a18;border-radius:10px;
  padding:10px 12px;font-family:'Fredoka',sans-serif;
  font-size:16px;color:#c8f0b8;background:#081205;
  outline:none;transition:border-color .2s,box-shadow .2s;width:100%;
}
.name-input::placeholder{color:#2a4a28}
.name-input:focus{border-color:#3aaa20;box-shadow:0 0 0 3px rgba(50,180,20,.12)}
.start-btn{
  width:100%;background:linear-gradient(135deg,#2ecc40,#1a8c28);
  border:none;border-radius:12px;color:white;
  font-family:'Fredoka',sans-serif;font-size:18px;font-weight:700;
  padding:14px;cursor:pointer;
  box-shadow:0 5px 0 #0d5216,0 0 30px rgba(20,200,40,.2);
  transition:transform .13s,box-shadow .13s;-webkit-appearance:none;
}
.start-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0d5216}

/* ── GAME SCREEN ── */
#gameScreen{z-index:3;flex-direction:column;gap:0;padding:0}

.table-surface{
  width:100vw;height:100svh;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  background:radial-gradient(ellipse 60% 50% at 50% 52%,#0d2e0a 0%,#07180a 50%,#030c05 100%);
}
.table-surface::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(ellipse 50% 40% at 50% 50%,rgba(0,255,80,.04) 0%,transparent 60%),
    radial-gradient(ellipse 88% 65% at 50% 50%,transparent 38%,rgba(0,0,0,.85) 100%);
  pointer-events:none;z-index:0;
}
.table-surface::after{
  content:"";position:absolute;inset:0;
  background:
    repeating-linear-gradient(170deg,transparent 0 28px,rgba(0,255,60,.018) 28px 29px),
    repeating-linear-gradient(80deg,transparent 0 40px,rgba(0,200,50,.012) 40px 41px);
  pointer-events:none;z-index:0;
}

/* ── LEAVE BUTTON ── */
.leave-btn{
  position:fixed;
  top:max(18px,calc(env(safe-area-inset-top,0px) + 14px));
  left:50%;transform:translateX(-50%);
  z-index:11;pointer-events:all;
  background:rgba(8,20,7,.88);
  border:1.5px solid #1e4018;border-radius:50%;
  color:#4a7a44;font-size:11px;font-weight:700;
  width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
  -webkit-appearance:none;line-height:1;
}
.leave-btn:active{background:rgba(180,0,0,.3);border-color:#6a1010;color:#ff6060}

/* ── AVATARS ── */
.avatars{
  position:fixed;top:max(18px,calc(env(safe-area-inset-top,0px) + 14px));left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:0 clamp(42px,10vw,52px);
  z-index:10;pointer-events:none;
}
.avatar{display:flex;align-items:center;gap:6px}
.avatar.right{flex-direction:row-reverse}
.face-wrap{position:relative;width:clamp(40px,9vw,58px);height:clamp(40px,9vw,58px);flex-shrink:0}
.face-bg{
  width:100%;height:100%;border-radius:50%;
  background:linear-gradient(145deg,#ffecd2,#ffcba4);
  border:2.5px solid rgba(255,255,255,.7);
  box-shadow:0 3px 12px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(20px,4.5vw,32px);
  position:relative;overflow:hidden;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.cheek{position:absolute;bottom:22%;width:28%;height:20%;border-radius:50%;background:rgba(255,100,100,.0);transition:background .4s,transform .4s}
.cheek.left{left:8%}.cheek.right{right:8%}
.face-bg.ate{transform:scale(1.2)}
.face-bg.ate .cheek{background:rgba(255,80,80,.6);transform:scaleX(1.35) scaleY(1.25)}
.face-bg.poisoned{animation:poisonFace .7s ease}
@keyframes poisonFace{
  0%{background:linear-gradient(145deg,#ffecd2,#ffcba4)}
  35%{background:linear-gradient(145deg,#c8f0a0,#88cc44);transform:scale(.88) rotate(-6deg)}
  70%{background:linear-gradient(145deg,#a0e080,#66aa22);transform:scale(1.06) rotate(4deg)}
  100%{background:linear-gradient(145deg,#ffecd2,#ffcba4)}
}
.avatar-name{
  font-size:clamp(11px,2.5vw,14px);font-weight:700;
  color:rgba(200,240,180,.92);text-shadow:0 2px 6px rgba(0,0,0,.6);
  max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.skull-row{display:flex;gap:2px;margin-top:1px}
.sk{font-size:10px;opacity:.2;transition:opacity .3s,transform .3s}
.sk.lit{opacity:1;transform:scale(1.25)}

/* ── GRID ── */
.grid{
  position:relative;z-index:2;
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:clamp(8px,2vw,16px);
  padding:clamp(10px,2vw,20px);
  width:min(480px,92vw);
  margin:auto;
}

/* ── PLATE ── */
.cell{
  aspect-ratio:1/1;border-radius:50%;
  position:relative;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:none;border:none;padding:0;
  -webkit-appearance:none;appearance:none;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1);
  user-select:none;-webkit-user-select:none;
}
.cell::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle at 32% 28%,rgba(255,255,255,.6) 0%,transparent 40%),
    radial-gradient(circle at 50% 50%,#f5f0e5 0%,#e8dfc8 45%,#d4c9ae 70%,#bdb09a 85%,#a89880 100%);
  box-shadow:
    inset 0 3px 9px rgba(255,255,255,.55),
    inset 0 -4px 10px rgba(0,0,0,.2),
    0 8px 26px rgba(0,0,0,.55),
    0 0 0 1px rgba(0,0,0,.25);
  transition:background .2s,box-shadow .2s;
}
.cell::after{
  content:"";position:absolute;inset:11%;border-radius:50%;
  border:1.5px solid rgba(160,148,130,.4);
  pointer-events:none;z-index:1;
}
.cell-emoji{
  position:relative;z-index:3;
  font-size:clamp(58px,14vw,110px);
  line-height:1;
  filter:drop-shadow(0 3px 7px rgba(0,0,0,.4));
  pointer-events:none;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),filter .2s;
}
@media(hover:hover){
  .cell:not(.eaten):not(.disabled):hover{transform:translateY(-6px) scale(1.05)}
  .cell:not(.eaten):not(.disabled):hover .cell-emoji{filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
}
.cell:not(.eaten):not(.disabled):active{transform:scale(.88)}

.cell.selected::before{
  background:
    radial-gradient(circle at 32% 28%,rgba(255,160,160,.45) 0%,transparent 38%),
    radial-gradient(circle at 50% 50%,#7a1010 0%,#5a0a0a 45%,#400606 70%,#2c0404 85%,#1c0202 100%);
  box-shadow:
    inset 0 3px 8px rgba(255,100,100,.3),
    inset 0 -4px 10px rgba(0,0,0,.4),
    0 8px 26px rgba(140,0,0,.5),
    0 0 0 3px rgba(200,30,30,.4),
    0 0 18px rgba(200,30,30,.22);
}
.cell.eaten{cursor:default}
.cell.eaten::before{opacity:.2;filter:grayscale(.8)}
.cell.eaten .cell-emoji{opacity:0}
.cell.disabled{pointer-events:none}

@keyframes safeAnim{0%{transform:scale(1)}30%{transform:scale(1.15) translateY(-10px)}60%{transform:scale(1.08) translateY(-5px)}100%{transform:scale(1)}}
@keyframes safePlate{30%{background:radial-gradient(circle at 32% 28%,rgba(200,255,200,.55) 0%,transparent 38%),radial-gradient(circle at 50% 50%,#1a6b2a 0%,#145420 45%,#0e3c18 70%,#0a2c12 85%,#06180c 100%);box-shadow:inset 0 3px 8px rgba(120,255,140,.35),inset 0 -4px 10px rgba(0,0,0,.25),0 8px 28px rgba(0,140,40,.45),0 0 0 3px rgba(50,200,90,.4),0 0 22px rgba(50,200,80,.3);}}
.cell.safe-flash{animation:safeAnim .65s ease forwards}
.cell.safe-flash::before{animation:safePlate .65s ease forwards}

@keyframes poisonAnim{0%{transform:scale(1)}18%{transform:scale(.86) rotate(-5deg)}45%{transform:scale(1.08) rotate(4deg)}72%{transform:scale(.97) rotate(-2deg)}100%{transform:scale(1) rotate(0)}}
@keyframes poisonPlate{18%{background:radial-gradient(circle at 32% 28%,rgba(255,80,80,.38) 0%,transparent 38%),radial-gradient(circle at 50% 50%,#3a0000 0%,#280000 45%,#1a0000 70%,#100000 85%,#080000 100%);box-shadow:inset 0 3px 8px rgba(255,80,80,.25),inset 0 -4px 10px rgba(0,0,0,.5),0 8px 28px rgba(180,0,0,.6),0 0 0 4px rgba(220,0,0,.55),0 0 32px rgba(220,0,0,.45);}}
.cell.poison-flash{animation:poisonAnim .75s ease forwards}
.cell.poison-flash::before{animation:poisonPlate .75s ease forwards}

/* ── TEXT SPLASH ── */
.splash{
  position:fixed;left:50%;top:60%;
  transform:translate(-50%,-50%) scale(0) rotate(-8deg);
  z-index:40;pointer-events:none;
  font-weight:700;font-family:'Fredoka',sans-serif;
  text-align:center;line-height:1;white-space:nowrap;
}
.splash.show{animation:splashPop .75s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes splashPop{
  0%{transform:translate(-50%,-50%) scale(0) rotate(-12deg);opacity:0}
  35%{transform:translate(-50%,-50%) scale(1.1) rotate(4deg);opacity:1}
  60%{transform:translate(-50%,-50%) scale(.95) rotate(-2deg);opacity:1}
  80%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1.15) rotate(2deg);opacity:0}
}

/* ── DIALOGUE BAR ── */
.dlg-overlay{
  position:fixed;inset:0;z-index:20;
  display:flex;align-items:flex-end;justify-content:center;
  padding:0 12px max(48px,calc(env(safe-area-inset-bottom,0px)+48px));
  pointer-events:none;
}
.dlg{
  width:min(500px,100%);
  background:rgba(8,20,7,.97);
  border:2px solid #1e4018;border-radius:16px;
  padding:12px 14px;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 18px 50px rgba(0,0,0,.6),0 4px 0 #0d3010;
  pointer-events:all;
  transform:translateY(130%);opacity:0;
  transition:transform .4s cubic-bezier(.34,1.4,.64,1),opacity .3s ease;
}
.dlg.visible{transform:translateY(0);opacity:1}
.dlg-icon{font-size:24px;flex-shrink:0}
.dlg-body{flex:1;min-width:0}
.dlg-title{font-size:clamp(12px,3vw,14px);font-weight:700;color:#9dff88;line-height:1.3}
.dlg-sub{font-family:'Nunito',sans-serif;font-size:clamp(10px,2.5vw,12px);color:#3d6a38;margin-top:2px;font-style:italic}
.dlg-btn{
  flex-shrink:0;
  background:linear-gradient(135deg,#2ecc40,#1a8c28);
  border:none;border-radius:9px;color:white;
  font-family:'Fredoka',sans-serif;font-size:clamp(11px,2.5vw,13px);font-weight:700;
  padding:9px 12px;cursor:pointer;
  box-shadow:0 4px 0 #0d5216;
  transition:transform .12s,box-shadow .12s;white-space:nowrap;
  -webkit-appearance:none;
}
.dlg-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0d5216}
.dlg-btn:disabled{opacity:.35;pointer-events:none}

/* ── WIN MODAL ── */
.win-overlay{
  position:fixed;inset:0;z-index:50;
  background:rgba(0,0,0,.88);backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;opacity:0;pointer-events:none;
  transition:opacity .35s ease;
}
.win-overlay.open{opacity:1;pointer-events:all}
.win-card{
  width:min(360px,100%);background:#0a1a08;
  border-radius:22px;padding:28px 22px;text-align:center;
  transform:scale(.85) translateY(20px);
  transition:transform .4s cubic-bezier(.34,1.4,.64,1);
  box-shadow:0 30px 80px rgba(0,0,0,.8),0 4px 0 #1a4a10,0 0 60px rgba(0,200,60,.1);
  border:2px solid #1e3a18;
}
.win-overlay.open .win-card{transform:scale(1) translateY(0)}
.win-icon{font-size:52px;display:block;margin-bottom:8px}
.win-title{font-size:clamp(22px,6vw,28px);font-weight:700;color:#7dff6b;margin-bottom:6px;text-shadow:0 0 20px rgba(80,255,60,.35)}
.win-quote{font-family:'Fredoka',sans-serif;font-size:clamp(15px,4vw,18px);color:#9dff88;margin-bottom:12px;font-weight:600}
.win-text{font-family:'Nunito',sans-serif;font-size:clamp(12px,3vw,14px);color:#4a7a44;line-height:1.6;margin-bottom:20px;font-style:italic}
.win-buttons{display:flex;flex-direction:column;gap:8px}
.win-btn{
  background:linear-gradient(135deg,#2ecc40,#1a8c28);
  border:none;border-radius:10px;color:white;
  font-family:'Fredoka',sans-serif;font-size:clamp(14px,4vw,16px);font-weight:700;
  padding:12px 20px;cursor:pointer;
  box-shadow:0 5px 0 #0d5216;-webkit-appearance:none;
}
.win-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0d5216}
.win-btn-secondary{
  background:transparent;border:2px solid #1e4018;
  border-radius:10px;color:#4a7a44;
  font-family:'Fredoka',sans-serif;font-size:clamp(12px,3.5vw,14px);font-weight:600;
  padding:10px 20px;cursor:pointer;-webkit-appearance:none;
}
.win-btn-secondary:active{border-color:#3aaa20;color:#7dff6b}

/* ── CONFETTI ── */
.confetti-el{position:fixed;top:-12px;width:8px;height:8px;border-radius:2px;z-index:60;pointer-events:none;animation:cFall 1.8s ease forwards}
@keyframes cFall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

@media(max-width:380px){
  .cell-emoji{font-size:clamp(44px,13vw,70px)}
  .grid{gap:7px;padding:8px}
}
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div class="screen" id="setupScreen">
  <div class="setup-card">
    <div class="setup-title">🍽️ ChotoMoto</div>
    <div class="setup-sub">Hide poison. Watch your friend suffer. Repeat.</div>
    <div class="name-row">
      <div class="name-field">
        <label>🍽️ The Hungry One</label>
        <input class="name-input" id="name1" type="text" placeholder="Your name" maxlength="12" autocomplete="off"/>
      </div>
      <div class="name-field">
        <label>🥄 The Other One</label>
        <input class="name-input" id="name2" type="text" placeholder="Your name" maxlength="12" autocomplete="off"/>
      </div>
    </div>
    <button class="start-btn" id="startBtn">Pull Up a Chair &amp; Let's Go 🍴</button>
  </div>
</div>

<!-- GAME SCREEN -->
<div class="screen hidden" id="gameScreen">
  <button class="leave-btn" id="leaveBtn">✕</button>
  <div class="avatars">
    <div class="avatar">
      <div class="face-wrap">
        <div class="face-bg" id="face1">
          <span class="cheek left"></span>
          <span id="faceEmoji1">😊</span>
          <span class="cheek right"></span>
        </div>
      </div>
      <div>
        <div class="avatar-name" id="avName1">P1</div>
        <div class="skull-row"><span class="sk" id="p1s1">💀</span><span class="sk" id="p1s2">💀</span></div>
      </div>
    </div>
    <div class="avatar right">
      <div class="face-wrap">
        <div class="face-bg" id="face2">
          <span class="cheek left"></span>
          <span id="faceEmoji2">😊</span>
          <span class="cheek right"></span>
        </div>
      </div>
      <div style="text-align:right">
        <div class="avatar-name" id="avName2">P2</div>
        <div class="skull-row" style="justify-content:flex-end"><span class="sk" id="p2s1">💀</span><span class="sk" id="p2s2">💀</span></div>
      </div>
    </div>
  </div>
  <div class="table-surface">
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- DIALOGUE BAR -->
<div class="dlg-overlay">
  <div class="dlg" id="dlg">
    <div class="dlg-icon" id="dlgIcon">🧪</div>
    <div class="dlg-body">
      <div class="dlg-title" id="dlgTitle">Poison two dishes</div>
      <div class="dlg-sub" id="dlgSub">Tap 2 plates. Keep it secret!</div>
    </div>
    <button class="dlg-btn" id="dlgBtn" disabled>OK</button>
  </div>
</div>

<!-- TEXT SPLASH -->
<div class="splash" id="splash"></div>

<!-- WIN MODAL -->
<div class="win-overlay" id="winOverlay">
  <div class="win-card">
    <span class="win-icon" id="winIcon">🏆</span>
    <div class="win-title" id="winTitle">Victory!</div>
    <div class="win-quote" id="winQuote"></div>
    <p class="win-text" id="winText">The feast is over.</p>
    <div class="win-buttons">
      <button class="win-btn" id="rematchBtn">🍽️ Rematch — I want revenge</button>
      <button class="win-btn-secondary" id="newGameBtn">New players</button>
    </div>
  </div>
</div>

<script>
const FOODS=["🍣","🍜","🍕","🍝","🌮","🌯","🥟","🍛","🥘","🍤","🍗","🥩","🥙","🍔","🥞","🍰","🍩","🍦","🦞","🫕","🍲","🧆","🫔","🥗","🍱","🧇","🥐","🍟","🌭","🧁"];

function calcIntensity(){
  const totalHits=state.hits[1]+state.hits[2];
  const totalEaten=state.eaten.length;
  const hitRate=totalEaten>0?totalHits/totalEaten:0;
  const closeCall=(state.hits[1]===1&&state.hits[2]===1)?30:0;
  const speedBonus=totalEaten>0?Math.max(0,20-totalEaten)*2:0;
  return Math.min(100,Math.round(hitRate*60+closeCall+speedBonus+totalHits*10));
}

const SPLASH_SAFE={
  low:["YES!","SAFE!","PHEW!","CLEAN!","NICE!"],
  mid:["OH YEAH!","LUCKY!","WHEW!!","NOT TODAY!","SURVIVED!"],
  high:["OH DAMN!","BARELY!","SO CLOSE!","STILL HERE!","WOW!!"],
  extreme:["INSANE!","NO WAY!!","GOAT!!","LEGENDARY!","UNREAL!"]
};
const SPLASH_POISON={
  low:["OOF.","UGH.","NOPE.","OOPS.","RIP."],
  mid:["OH NO!","HELL NO!","YIKES!","CURSED!","DEAD."],
  high:["SHIT!","OH DAMN!","BETRAYED!","DESTROYED!","BRUTAL!"],
  extreme:["💀 DEAD!","OBLITERATED!","COOKED!!","OH MY GOD!","FINISHED!"]
};
const SPLASH_COLORS_SAFE=["#7dff6b","#2ecc40","#aaff88","#fff176","#69f0ae"];
const SPLASH_COLORS_POISON=["#ff5252","#ff1744","#ff6b6b","#f50057","#ff8a80"];

function intensityBucket(s){return s<25?"low":s<50?"mid":s<75?"high":"extreme";}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

const SAFE_DLGS=[
  ["🥳 SAFE!","Your taste buds lived to see another day."],
  ["😇 Still alive!","Statistically speaking, you're on borrowed time."],
  ["✅ Clean bite!","That plate was innocent. Unlike your opponent."],
  ["🍀 Lucky!!","Someone up there likes you. For now."],
  ["😏 Too easy.","That dish had zero drama. Move along."],
  ["🎉 PHEW!","Your stomach says thanks. Barely."],
  ["🫡 Survived.","One down. Don't get cocky."],
];
const POISON_DLGS=[
  ["💀 POISONED!","Your stomach just filed a formal complaint."],
  ["🤮 Oof.","That dish had a secret ingredient: pure betrayal."],
  ["☠️ Oh no no no!","You trusted the wrong plate. Classic rookie move."],
  ["🫠 Welp.","Tastes like someone genuinely hates you."],
  ["😵 YIKES!","Your face is telling the whole story right now."],
  ["🧪 Contaminated!","They really put the poison on THAT one. Bold."],
  ["💔 Betrayed.","The table has spoken. It said goodbye."],
];
const WIN_QUOTES=[
  "You played chess while they played checkers. 🧠",
  "Unbothered. Moisturized. Victorious. 💅",
  "Dinner AND a win? Peak performance.",
  "They never saw it coming. You did. 😈",
  "The stomach knew. The stomach always knows.",
  "Not all heroes eat safely. You do though.",
  "Natural selection at the dinner table.",
];
const WIN_TEXTS=[
  (l)=>`${l} ate BOTH poison dishes. Impressive dedication to losing.`,
  (l)=>`${l} couldn't tell food from a trap. Concerning.`,
  (l)=>`RIP ${l}'s stomach. The poison is revealed below. 💀`,
  (l)=>`${l} trusted their gut. Their gut lied. Twice.`,
  (l)=>`${l} finished with a 0% survival rate. Respect.`,
];
const DRAW_QUOTES=[
  "Both of you are chaotic gremlins.",
  "12 dishes. 4 poisons. Zero casualties. Legend.",
  "You survived by sheer dumb luck.",
  "The poison was there. You were just immune. Somehow.",
  "Against all odds, everyone is still alive. Barely.",
];
const DRAW_TEXTS=[
  "All 12 dishes eaten. No one went down. The table is shocked.",
  "Every plate cleared. The poison had no power today.",
  "A draw! Neither could land the final blow. Embarrassing. Iconic.",
];

const state={
  phase:"p1-poison",currentPlayer:1,
  p1Poison:[],p2Poison:[],
  eaten:[],hits:{1:0,2:0},
  foods:[],names:{1:"Hungry 1",2:"Hungry 2"},
  ateCount:{1:0,2:0}
};

const $=id=>document.getElementById(id);
let splashTimer=null;

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function showSplash(text,colors){
  const el=$("splash");
  if(splashTimer) clearTimeout(splashTimer);
  el.classList.remove("show");void el.offsetWidth;
  el.textContent=text;
  el.style.color=pick(colors);
  el.style.fontSize=text.length<=4?"clamp(60px,18vw,120px)":text.length<=8?"clamp(44px,13vw,90px)":"clamp(32px,9vw,68px)";
  el.style.textShadow=`0 0 30px ${pick(colors)}88, 0 4px 0 rgba(0,0,0,.5)`;
  el.classList.add("show");
  splashTimer=setTimeout(()=>el.classList.remove("show"),750);
}

function confetti(){
  const cols=["#2ecc40","#7dff6b","#ff5252","#ffcd6b","#9c6bff","#ff80ab","#26c6da"];
  for(let i=0;i<52;i++){
    const el=document.createElement("div");
    el.className="confetti-el";
    el.style.left=Math.random()*100+"vw";
    el.style.background=cols[Math.floor(Math.random()*cols.length)];
    el.style.animationDelay=Math.random()*.6+"s";
    el.style.transform=`rotate(${Math.random()*180}deg)`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),2400);
  }
}

function showDlg(){requestAnimationFrame(()=>$("dlg").classList.add("visible"))}
function hideDlg(){$("dlg").classList.remove("visible")}

function updateSkulls(){
  for(let p=1;p<=2;p++){
    $(`p${p}s1`).classList.toggle("lit",state.hits[p]>=1);
    $(`p${p}s2`).classList.toggle("lit",state.hits[p]>=2);
  }
}

function animateFaceEat(player){
  const f=$(`face${player}`);
  f.classList.remove("ate");void f.offsetWidth;f.classList.add("ate");
  $(`faceEmoji${player}`).textContent="😋";
  setTimeout(()=>{f.classList.remove("ate");$(`faceEmoji${player}`).textContent="😊";},1200);
}

function animateFacePoison(player){
  const f=$(`face${player}`);
  f.classList.remove("poisoned");void f.offsetWidth;f.classList.add("poisoned");
  $(`faceEmoji${player}`).textContent="🤢";
  setTimeout(()=>{f.classList.remove("poisoned");$(`faceEmoji${player}`).textContent="😊";},1200);
}

function updateDlg(){
  $("dlgBtn").style.display="inline-block";
  const n1=state.names[1],n2=state.names[2],cp=state.currentPlayer,cn=state.names[cp];
  if(state.phase==="p1-poison"){
    const left=2-state.p1Poison.length;
    $("dlgIcon").textContent="🧪";
    $("dlgTitle").textContent=`${n1}, do your evil thing`;
    $("dlgSub").textContent=left===2?`Pick 2 plates to poison. ${n2} cannot look!`:left===1?`One more cursed plate, villain 😈`:`Evil plan complete. ${n2} has no idea 😏`;
    $("dlgBtn").textContent=`Pass to ${n2} 🫣`;
    $("dlgBtn").disabled=state.p1Poison.length!==2;
  } else if(state.phase==="p2-poison"){
    const left=2-state.p2Poison.length;
    $("dlgIcon").textContent="🧪";
    $("dlgTitle").textContent=`${n2}, time to be sneaky`;
    $("dlgSub").textContent=left===2?`Ruin someone's dinner. Pick 2.`:left===1?`One more poisoned plate 😈`:`Masterpiece. ${n1} suspects nothing 🎭`;
    $("dlgBtn").textContent=`Serve the feast! 🍽️`;
    $("dlgBtn").disabled=state.p2Poison.length!==2;
  } else if(state.phase==="eat"){
    $("dlgIcon").textContent="🤌";
    $("dlgTitle").textContent=`${cn}, pick a plate!`;
    $("dlgSub").textContent="Trust your gut. (Or don't. Risky.)";
    $("dlgBtn").style.display="none";
  }
}

function render(){
  const grid=$("grid");
  grid.innerHTML="";
  $("dlgBtn").style.display="inline-block";
  state.foods.forEach((food,i)=>{
    const btn=document.createElement("button");
    btn.className="cell";
    const selP1=state.phase==="p1-poison"&&state.p1Poison.includes(i);
    const selP2=state.phase==="p2-poison"&&state.p2Poison.includes(i);
    const isEaten=state.eaten.includes(i);
    if(selP1||selP2) btn.classList.add("selected");
    if(isEaten) btn.classList.add("eaten");
    const span=document.createElement("span");
    span.className="cell-emoji";
    span.textContent=state.phase!=="eat"?((selP1||selP2)?"🧪":""):(isEaten?"":food);
    btn.appendChild(span);
    btn.addEventListener("click",()=>handleClick(i,btn));
    grid.appendChild(btn);
  });
  updateSkulls();updateDlg();showDlg();
}

function handleClick(i,btn){
  if(state.phase==="p1-poison"){togglePoison(state.p1Poison,i);render();}
  else if(state.phase==="p2-poison"){togglePoison(state.p2Poison,i);render();}
  else if(state.phase==="eat"){eatFood(i,btn);}
}

function togglePoison(list,i){
  const idx=list.indexOf(i);
  if(idx!==-1) list.splice(idx,1);
  else if(list.length<2) list.push(i);
}

$("dlgBtn").addEventListener("click",()=>{
  if(state.phase==="p1-poison"&&state.p1Poison.length===2){
    hideDlg();state.phase="p2-poison";
    setTimeout(()=>render(),400);
  } else if(state.phase==="p2-poison"&&state.p2Poison.length===2){
    hideDlg();state.phase="eat";
    state.foods=shuffle(FOODS).slice(0,12);
    confetti();
    setTimeout(()=>render(),400);
  }
});

function eatFood(i,btn){
  if(state.eaten.includes(i)) return;
  const grid=$("grid");
  [...grid.children].forEach(c=>c.classList.add("disabled"));
  state.eaten.push(i);
  const allPoison=[...state.p1Poison,...state.p2Poison];
  const isPoison=allPoison.includes(i);
  const em=btn.querySelector(".cell-emoji");
  const cp=state.currentPlayer,cn=state.names[cp];
  const bucket=intensityBucket(calcIntensity());

  if(isPoison){
    state.hits[cp]++;
    btn.classList.add("poison-flash");
    if(em) em.textContent="☠️";
    animateFacePoison(cp);updateSkulls();
    const sw=pick(SPLASH_POISON[bucket]);
    const [title,sub]=pick(POISON_DLGS);
    showSplash(sw,SPLASH_COLORS_POISON);
    $("dlgIcon").textContent="💀";
    $("dlgTitle").textContent=`${cn} — ${title}`;
    $("dlgSub").textContent=state.hits[cp]>=2?`${sub} 2 strikes. You're cooked 🫠`:sub;
    $("dlgBtn").style.display="none";showDlg();
  } else {
    state.ateCount[cp]++;
    btn.classList.add("safe-flash");
    if(em) em.textContent="✨";
    animateFaceEat(cp);
    const sw=pick(SPLASH_SAFE[bucket]);
    const [title,sub]=pick(SAFE_DLGS);
    showSplash(sw,SPLASH_COLORS_SAFE);
    $("dlgIcon").textContent="🥳";
    $("dlgTitle").textContent=`${cn} — ${title}`;
    $("dlgSub").textContent=sub;
    $("dlgBtn").style.display="none";showDlg();
  }

  setTimeout(()=>{
    btn.classList.remove("poison-flash","safe-flash");
    [...grid.children].forEach(c=>c.classList.remove("disabled"));
    if(state.hits[cp]>=2){endGame(cp===1?2:1,cp);return;}
    if(state.eaten.length>=12){endDraw();return;}
    state.currentPlayer=cp===1?2:1;
    render();
  },1000);
}

function endGame(winner,loser){
  revealPoison();confetti();hideDlg();
  $("winIcon").textContent="🏆";
  $("winTitle").textContent=`${state.names[winner]} wins!`;
  $("winQuote").textContent=pick(WIN_QUOTES);
  $("winText").textContent=pick(WIN_TEXTS)(state.names[loser]);
  setTimeout(()=>$("winOverlay").classList.add("open"),700);
}

function endDraw(){
  revealPoison();confetti();hideDlg();
  $("winIcon").textContent="🤝";
  $("winTitle").textContent="Nobody died!";
  $("winQuote").textContent=pick(DRAW_QUOTES);
  $("winText").textContent=pick(DRAW_TEXTS);
  setTimeout(()=>$("winOverlay").classList.add("open"),700);
}

function revealPoison(){
  const grid=$("grid");
  [...grid.children].forEach((cell,i)=>{
    if(state.p1Poison.includes(i)||state.p2Poison.includes(i)){
      const em=cell.querySelector(".cell-emoji");
      if(em) em.textContent="☠️";
      cell.classList.add("selected");
    }
  });
}

function rematch(){
  $("winOverlay").classList.remove("open");hideDlg();
  Object.assign(state,{phase:"p1-poison",currentPlayer:1,p1Poison:[],p2Poison:[],eaten:[],hits:{1:0,2:0},foods:new Array(12).fill(""),ateCount:{1:0,2:0}});
  $("faceEmoji1").textContent="😊";$("faceEmoji2").textContent="😊";
  for(let p=1;p<=2;p++){$(`p${p}s1`).classList.remove("lit");$(`p${p}s2`).classList.remove("lit");}
  setTimeout(()=>render(),200);
}

function backToSetup(){
  $("winOverlay").classList.remove("open");hideDlg();
  $("gameScreen").classList.add("out");
  setTimeout(()=>{
    $("gameScreen").classList.add("hidden");$("gameScreen").classList.remove("out");
    $("setupScreen").classList.remove("hidden");
    $("faceEmoji1").textContent="😊";$("faceEmoji2").textContent="😊";
    for(let p=1;p<=2;p++){$(`p${p}s1`).classList.remove("lit");$(`p${p}s2`).classList.remove("lit");}
  },420);
}

function startGame(n1,n2){
  state.names={1:n1,2:n2};
  Object.assign(state,{phase:"p1-poison",currentPlayer:1,p1Poison:[],p2Poison:[],eaten:[],hits:{1:0,2:0},foods:new Array(12).fill(""),ateCount:{1:0,2:0}});
  $("avName1").textContent=n1;$("avName2").textContent=n2;
  $("faceEmoji1").textContent="😊";$("faceEmoji2").textContent="😊";
  $("setupScreen").classList.add("out");
  setTimeout(()=>{
    $("setupScreen").classList.add("hidden");$("setupScreen").classList.remove("out");
    $("gameScreen").classList.remove("hidden");render();
  },420);
}

$("startBtn").addEventListener("click",()=>{
  const n1=$("name1").value.trim()||"Hungry 1";
  const n2=$("name2").value.trim()||"Hungry 2";
  startGame(n1,n2);
});
$("rematchBtn").addEventListener("click",rematch);
$("newGameBtn").addEventListener("click",backToSetup);
$("leaveBtn").addEventListener("click",backToSetup);
</script>
</body>
</html>
